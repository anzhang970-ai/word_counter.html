<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字数统计与阅读时长计算器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            color: #1f2937;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 14px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: #2563eb;
        }
        #clear-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        #clear-btn:hover {
            background-color: #dc2626;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background-color: #f3f4f6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }
        .stat-label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 实时文本字数与阅读时长统计</h1>
    <textarea id="text-input" placeholder="请在此处粘贴或输入文本..."></textarea>
    
    <div>
        <button id="clear-btn">清空内容</button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="char-count">0</div>
            <div class="stat-label">总字符数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="chinese-count">0</div>
            <div class="stat-label">纯中文字数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="read-time">0</div>
            <div class="stat-label">预计阅读 (分钟)</div>
        </div>
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const charCount = document.getElementById('char-count');
    const chineseCount = document.getElementById('chinese-count');
    const readTime = document.getElementById('read-time');
    const clearBtn = document.getElementById('clear-btn');

    textInput.addEventListener('input', function() {
        const text = textInput.value;
        const totalChars = text.length;
        charCount.innerText = totalChars;
        
        const chineseMatches = text.match(/[\u4e00-\u9fa5]/g);
        const totalChinese = chineseMatches ? chineseMatches.length : 0;
        chineseCount.innerText = totalChinese;
        
        const minutes = Math.ceil(totalChars / 400);
        readTime.innerText = totalChars > 0 ? minutes : 0;
    });

    clearBtn.addEventListener('click', function() {
        textInput.value = '';
        charCount.innerText = '0';
        chineseCount.innerText = '0';
        readTime.innerText = '0';
    });
</script>

</body>
</html>
